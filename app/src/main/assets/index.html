<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Gierka Oliwka</title>
<style>
  @font-face { font-family: 'Fredoka'; font-weight: 500; font-display: swap; src: url(fonts/fredoka-latin-500-normal.woff2) format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: 'Fredoka'; font-weight: 500; font-display: swap; src: url(fonts/fredoka-latin-ext-500-normal.woff2) format('woff2');
    unicode-range: U+0100-02AF, U+0304, U+0308, U+0329, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  @font-face { font-family: 'Fredoka'; font-weight: 600; font-display: swap; src: url(fonts/fredoka-latin-600-normal.woff2) format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: 'Fredoka'; font-weight: 600; font-display: swap; src: url(fonts/fredoka-latin-ext-600-normal.woff2) format('woff2');
    unicode-range: U+0100-02AF, U+0304, U+0308, U+0329, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  @font-face { font-family: 'Fredoka'; font-weight: 700; font-display: swap; src: url(fonts/fredoka-latin-700-normal.woff2) format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: 'Fredoka'; font-weight: 700; font-display: swap; src: url(fonts/fredoka-latin-ext-700-normal.woff2) format('woff2');
    unicode-range: U+0100-02AF, U+0304, U+0308, U+0329, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  :root { --cream: #fff8e7; --brown: #4e342e; --green: #7cb342; --green2: #558b2f; --orange: #e65100; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000;
    touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent; font-family: Fredoka, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-weight: 500; }
  canvas { display: block; width: 100vw; height: 100vh; }
  button { font: inherit; cursor: pointer; }

  /* ekrany */
  .screen { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center;
    padding: 22px 16px 30px; box-sizing: border-box; overflow-y: auto; touch-action: pan-y;
    background: linear-gradient(rgba(0,40,70,.35), rgba(60,30,0,.55)); }
  .screen.on { display: flex; animation: fadein .18s ease-out; }
  #album, #shop, #scores, #settings { background: linear-gradient(rgba(10,50,80,.88), rgba(70,40,10,.92)); }
  @keyframes fadein { from { opacity: 0; transform: translateY(8px); } }
  .screen > * { width: 100%; max-width: 420px; }
  h1 { margin: 14px 0 12px; text-align: center; font-size: 34px; color: #fff; letter-spacing: .5px;
    text-shadow: 0 3px 0 var(--orange), 0 6px 14px rgba(0,0,0,.45); }
  h2 { margin: 6px 0 10px; text-align: center; color: var(--orange); font-size: 28px; font-weight: 700; }
  h3 { margin: 16px 0 8px; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,.5); }
  .sub { text-align: center; color: #fff; opacity: .9; font-size: 13px; text-shadow: 0 1px 3px rgba(0,0,0,.6); }

  .list { display: flex; flex-direction: column; gap: 9px; }
  .list button, .grid4 button, .btns button {
    border: 0; border-radius: 16px; padding: 13px 16px; font-size: 18px; font-weight: 600; color: var(--brown);
    background: var(--cream); box-shadow: 0 4px 0 #d7c3a0, 0 6px 14px rgba(0,0,0,.25); text-align: left;
    display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .list button small, .grid4 button small { font-weight: 500; font-size: 12px; opacity: .7; text-align: right; }
  button.primary { background: linear-gradient(#9ccc65, var(--green2)); color: #fff; box-shadow: 0 4px 0 #33691e, 0 6px 14px rgba(0,0,0,.25); }
  button.primary small { color: #fff; opacity: .85; }
  button:active { transform: translateY(2px); }
  .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
  .grid4 button { flex-direction: column; justify-content: center; font-size: 26px; padding: 10px 4px; text-align: center; }
  .grid4 button small { text-align: center; opacity: .85; }

  .hdr { display: flex; align-items: center; gap: 8px; }
  .lvl { flex: 1; display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,.92); border-radius: 20px; padding: 6px 12px;
    font-weight: 800; color: var(--brown); font-size: 14px; }
  .lvl.wide { margin: 8px 0; flex: none; }
  .bar { flex: 1; height: 9px; background: #e0d6c2; border-radius: 6px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: linear-gradient(90deg, #ffca28, #ff7043); border-radius: 6px; }
  .pill { background: rgba(255,255,255,.92); border-radius: 20px; padding: 6px 12px; font-weight: 800; color: var(--brown); font-size: 14px; white-space: nowrap; }

  .top { display: flex; align-items: center; gap: 10px; }
  .top h2 { flex: 1; text-align: left; color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,.5); margin: 0; }
  .back { border: 0; width: 42px; height: 42px; border-radius: 50%; font-size: 22px; font-weight: 800; background: var(--cream); color: var(--brown);
    box-shadow: 0 3px 0 #d7c3a0; }

  /* karty: pauza, wyniki, modal */
  #pause, #results { justify-content: center; }
  #pause > *, #results > * { max-width: 380px; }
  #pause, #results { background: rgba(0,0,0,.5); }
  #pause h2, #results h2 { background: var(--cream); border-radius: 18px 18px 0 0; margin: 0; padding: 16px 10px 4px; }
  #pause .missions, #results .missions { background: var(--cream); padding: 6px 16px; box-sizing: border-box; }
  #results .score, #results p, #results .rec, #results .gain, #results .lvl.wide { background: var(--cream); margin: 0; box-sizing: border-box; }
  #results .score { font-size: 46px; font-weight: 900; text-align: center; color: var(--brown); padding: 2px 0; }
  #results p { text-align: center; color: var(--brown); padding: 3px 10px; }
  #results .rec { text-align: center; font-weight: 800; color: var(--orange); font-size: 18px; padding: 4px; animation: pulse .8s infinite alternate; }
  @keyframes pulse { to { transform: scale(1.06); } }
  #results .win { color: #2e7d32; font-weight: 800; }
  #results .gain { display: flex; justify-content: center; gap: 20px; font-weight: 800; color: var(--brown); padding: 8px; font-size: 17px; }
  #results .lvl.wide { border-radius: 0; padding: 8px 16px; }
  #pause .list, #results .list { background: var(--cream); padding: 10px 14px 16px; border-radius: 0 0 18px 18px; box-sizing: border-box; }
  #pause .list button, #results .list button { box-shadow: 0 3px 0 #d7c3a0; background: #fff; }
  #pause .list button.primary, #results .list button.primary { background: linear-gradient(#9ccc65, var(--green2)); box-shadow: 0 3px 0 #33691e; }
  .mis { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-bottom: 1px dashed #e0d0b0; font-size: 14px; color: var(--brown); }
  .mis em { font-style: normal; opacity: .7; white-space: nowrap; }
  .mis.done span { text-decoration: line-through; opacity: .7; }

  #modal { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.55); z-index: 20; padding: 16px; touch-action: pan-y; }
  #modal.on { display: flex; }
  #modal .card { background: var(--cream); border-radius: 20px; padding: 18px; max-width: 360px; width: 100%; box-sizing: border-box; color: var(--brown);
    border: 4px solid #8bc34a; box-shadow: 0 10px 30px rgba(0,0,0,.4); max-height: 85vh; overflow-y: auto; animation: pop .25s ease-out; }
  @keyframes pop { from { transform: scale(.85); opacity: 0; } }
  #modal p { line-height: 1.4; }
  #modal .msg { font-size: 18px; text-align: center; }
  #modal .big { font-size: 56px; text-align: center; }
  #modal .btns { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  #modal .btns button { justify-content: center; text-align: center; box-shadow: 0 3px 0 #d7c3a0; background: #fff; }
  #modal .btns button.primary { background: linear-gradient(#9ccc65, var(--green2)); box-shadow: 0 3px 0 #33691e; }
  #modal input, .row input { font: inherit; font-size: 18px; padding: 10px 12px; border-radius: 12px; border: 2px solid #c5b08a; width: 100%; box-sizing: border-box; text-transform: uppercase; }
  .row input { text-transform: none; margin-top: 6px; }
  .how p { margin: 6px 0; font-size: 15px; }
  .row { display: block; background: var(--cream); border-radius: 16px; padding: 12px 14px; margin: 10px 0; font-weight: 700; color: var(--brown); }

  /* ===== menu główne ===== */
  #menu { background: linear-gradient(180deg, rgba(8,60,110,.55) 0%, rgba(20,90,140,.25) 38%, rgba(120,60,10,.35) 70%, rgba(60,25,0,.7) 100%);
    -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); padding: 14px 16px 18px; gap: 0; }
  #menu > * { position: relative; z-index: 1; }
  .bubbles { position: absolute !important; inset: 0; z-index: 0 !important; overflow: hidden; pointer-events: none; max-width: none !important; }
  .bubbles i { position: absolute; bottom: -40px; width: 14px; height: 14px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.95), rgba(255,255,255,.25) 45%, rgba(255,255,255,.05) 70%);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.5); animation: rise linear infinite; }
  .bubbles i:nth-child(1) { left: 6%;  animation-duration: 11s; transform: scale(.8); }
  .bubbles i:nth-child(2) { left: 18%; animation-duration: 15s; animation-delay: -4s; width: 22px; height: 22px; }
  .bubbles i:nth-child(3) { left: 29%; animation-duration: 9s;  animation-delay: -2s; }
  .bubbles i:nth-child(4) { left: 41%; animation-duration: 13s; animation-delay: -8s; width: 9px; height: 9px; }
  .bubbles i:nth-child(5) { left: 53%; animation-duration: 17s; animation-delay: -1s; width: 26px; height: 26px; }
  .bubbles i:nth-child(6) { left: 64%; animation-duration: 10s; animation-delay: -6s; }
  .bubbles i:nth-child(7) { left: 75%; animation-duration: 14s; animation-delay: -3s; width: 18px; height: 18px; }
  .bubbles i:nth-child(8) { left: 86%; animation-duration: 12s; animation-delay: -9s; width: 10px; height: 10px; }
  .bubbles i:nth-child(9) { left: 94%; animation-duration: 16s; animation-delay: -5s; }
  .bubbles i:nth-child(10){ left: 12%; animation-duration: 19s; animation-delay: -12s; width: 30px; height: 30px; opacity: .6; }
  .bubbles i:nth-child(11){ left: 47%; animation-duration: 21s; animation-delay: -15s; width: 34px; height: 34px; opacity: .5; }
  .bubbles i:nth-child(12){ left: 80%; animation-duration: 18s; animation-delay: -7s; width: 24px; height: 24px; opacity: .7; }
  @keyframes rise { from { transform: translate(0, 0); } 50% { transform: translate(14px, -55vh); } to { transform: translate(-6px, -115vh); } }

  .mtop { display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 6px; border-radius: 30px;
    background: rgba(255,255,255,.22); box-shadow: inset 0 0 0 1px rgba(255,255,255,.35); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
  .lvbadge { width: 46px; height: 46px; border-radius: 50%; flex: none; display: grid; place-items: center;
    background: conic-gradient(#ffca28 calc(var(--p) * 1%), rgba(255,255,255,.35) 0); }
  .lvbadge b { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-size: 19px; font-weight: 700;
    color: #fff; background: linear-gradient(#ff8a65, #e64a19); box-shadow: inset 0 -3px 0 rgba(0,0,0,.18); }
  .lvinfo { flex: 1; min-width: 0; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.35); }
  .lvinfo span { font-weight: 700; font-size: 14px; }
  .lvinfo .bar { height: 7px; margin: 2px 0; background: rgba(255,255,255,.35); }
  .lvinfo small { font-size: 10px; opacity: .9; }
  .chip { display: flex; align-items: center; gap: 5px; padding: 6px 11px; border-radius: 18px; font-weight: 700; font-size: 15px; color: #5d4037;
    background: linear-gradient(#fffdf6, #fff1d2); box-shadow: 0 2px 0 #e0c79b; white-space: nowrap; }
  .cicon { width: 16px; height: 16px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff59d, #ffc107 45%, #ff8f00);
    box-shadow: inset 0 0 0 2px rgba(255,143,0,.55); }

  .sign { display: flex; justify-content: center; margin-top: 10px; height: 104px; }
  .sign .board { position: relative; margin-top: 22px; padding: 6px 26px 10px; border-radius: 14px; transform-origin: 50% -22px;
    animation: swing 4s ease-in-out infinite; text-align: center; line-height: .95;
    background: repeating-linear-gradient(176deg, rgba(0,0,0,0) 0 9px, rgba(0,0,0,.06) 9px 11px), linear-gradient(#c98b4f, #9a6230);
    box-shadow: inset 0 2px 0 rgba(255,255,255,.3), inset 0 -4px 0 rgba(0,0,0,.2), 0 8px 18px rgba(0,0,0,.35); border: 3px solid #7a4a22; }
  .sign .board::before, .sign .board::after { content: ''; position: absolute; top: -26px; width: 5px; height: 30px; border-radius: 3px;
    background: repeating-linear-gradient(160deg, #a0703a 0 3px, #d9b27a 3px 6px); box-shadow: 0 1px 2px rgba(0,0,0,.35); }
  .sign .board::before { left: 24px; transform: rotate(-8deg); }
  .sign .board::after { right: 24px; transform: rotate(8deg); }
  .sign span { display: block; font-weight: 700; color: #fff6df; letter-spacing: 1px;
    text-shadow: 0 2px 0 #6b3d17, 0 0 12px rgba(255,214,140,.35); }
  .sign span:first-child { font-size: 20px; color: #ffe2a8; }
  .sign span:last-child { font-size: 38px; }
  @keyframes swing { 0%, 100% { transform: rotate(-1.6deg); } 50% { transform: rotate(1.6deg); } }

  .hero { position: relative; height: 150px; display: flex; justify-content: center; align-items: flex-end; margin: -2px 0 4px; }
  .rays { position: absolute; left: 50%; top: 50%; width: 260px; height: 260px; margin: -138px 0 0 -130px; border-radius: 50%;
    background: repeating-conic-gradient(rgba(255,236,170,.32) 0 10deg, rgba(255,236,170,0) 10deg 22deg);
    -webkit-mask: radial-gradient(circle, #000 20%, transparent 68%); mask: radial-gradient(circle, #000 20%, transparent 68%);
    animation: spin 26s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hdrink { position: relative; animation: bob 2.6s ease-in-out infinite; filter: drop-shadow(0 6px 8px rgba(0,0,0,.25)); }
  .hdrink.swap canvas { animation: popin .45s cubic-bezier(.3,1.7,.5,1); }
  @keyframes popin { from { transform: scale(.4) rotate(-10deg); opacity: 0; } }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
  .hshadow { position: absolute; bottom: 2px; width: 90px; height: 14px; border-radius: 50%; background: rgba(40,20,0,.3); filter: blur(3px);
    animation: shad 2.6s ease-in-out infinite; }
  @keyframes shad { 50% { transform: scaleX(.8); opacity: .7; } }

  .mmain { display: flex; flex-direction: column; gap: 9px; }
  .mmain button { border: 0; display: flex; align-items: center; gap: 12px; text-align: left; color: #fff; border-radius: 22px; position: relative; overflow: hidden; }
  .mmain button b { display: block; }
  .mmain button small { display: block; font-size: 13px; font-weight: 500; opacity: .92; }
  .mmain button::after { content: ''; position: absolute; left: 6%; right: 6%; top: 4px; height: 42%; border-radius: 18px;
    background: linear-gradient(rgba(255,255,255,.45), rgba(255,255,255,0)); pointer-events: none; }
  .play { padding: 8px 18px 8px 12px; background: linear-gradient(#a5d65a, #62a72d 60%, #4f8f22); box-shadow: 0 6px 0 #33691e, 0 10px 22px rgba(0,0,0,.3);
    animation: breathe 2.4s ease-in-out infinite; }
  .play b { font-size: 34px; letter-spacing: 2px; text-shadow: 0 2px 0 #33691e; line-height: 1; }
  @keyframes breathe { 50% { box-shadow: 0 6px 0 #33691e, 0 10px 30px rgba(174,234,0,.55); } }
  .ticket { padding: 10px 16px; background: linear-gradient(#ffb74d, #f57c00); box-shadow: 0 5px 0 #bf5f00, 0 8px 18px rgba(0,0,0,.25); }
  .ticket b { font-size: 20px; }
  .ticket .tk { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.3); font-size: 18px; flex: none; }

  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 11px; }
  .mcard { border: 0; border-radius: 20px; padding: 8px 8px 8px 6px; display: flex; align-items: center; gap: 4px; text-align: left; color: #fff;
    position: relative; overflow: hidden; }
  .mcard canvas { flex: none; }
  .mcard b { display: block; font-size: 15px; font-weight: 700; line-height: 1.1; }
  .mcard small { display: block; font-size: 11px; opacity: .92; margin-top: 2px; }
  .mcard::after { content: ''; position: absolute; right: -18px; top: -18px; width: 60px; height: 60px; border-radius: 50%; background: rgba(255,255,255,.14); }
  .c-daily { background: linear-gradient(135deg, #ff8a80, #e91e63); box-shadow: 0 4px 0 #ad1457, 0 6px 14px rgba(0,0,0,.25); }
  .c-time  { background: linear-gradient(135deg, #ffd54f, #fb8c00); box-shadow: 0 4px 0 #c66900, 0 6px 14px rgba(0,0,0,.25); }
  .c-zen   { background: linear-gradient(135deg, #4dd0e1, #00897b); box-shadow: 0 4px 0 #00695c, 0 6px 14px rgba(0,0,0,.25); }
  .c-code  { background: linear-gradient(135deg, #b39ddb, #5e35b1); box-shadow: 0 4px 0 #4527a0, 0 6px 14px rgba(0,0,0,.25); }
  .mcard:active, .mmain button:active, .dbtn:active { transform: translateY(3px); }

  .dock { margin-top: auto; padding-top: 12px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .dock { position: sticky; bottom: 0; }
  .dbtn { border: 0; position: relative; border-radius: 18px; padding: 8px 2px 6px; display: flex; flex-direction: column; align-items: center; gap: 2px;
    background: rgba(255,250,240,.9); box-shadow: 0 3px 0 rgba(120,80,40,.35), 0 6px 14px rgba(0,0,0,.2); color: #5d4037; }
  .dbtn .dic { font-size: 24px; line-height: 1.1; }
  .dbtn small { font-size: 12px; font-weight: 600; }
  .dbtn em { position: absolute; top: -6px; right: 4px; font-style: normal; font-size: 10px; font-weight: 700; color: #fff; background: #e53935;
    border-radius: 10px; padding: 1px 6px; box-shadow: 0 1px 0 #b71c1c; }

  /* kolekcja */
  .cards { display: flex; flex-direction: column; gap: 8px; }
  .acard { display: flex; gap: 12px; align-items: center; background: var(--cream); border-radius: 16px; padding: 8px 12px; color: var(--brown); }
  .acard b { display: block; font-size: 16px; }
  .acard small { display: block; font-size: 13px; opacity: .85; margin-top: 2px; }
  .acard em { display: block; font-size: 11px; opacity: .6; font-style: normal; margin-top: 3px; }
  .acard.locked { background: rgba(255,248,231,.6); }
  .acard.secret { background: linear-gradient(90deg, #fff3e0, #fce4ec); }
  .acard.secret.locked { background: rgba(255,240,245,.55); }
  .sic { font-size: 40px; width: 64px; text-align: center; }

  /* sklep */
  .shop { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .sitem { background: var(--cream); border-radius: 16px; padding: 8px; display: flex; flex-direction: column; gap: 6px; color: var(--brown); text-align: center; border: 3px solid transparent; }
  .sitem.sel { border-color: #8bc34a; }
  .sitem .prev { height: 74px; border-radius: 12px; box-shadow: inset 0 0 0 2px rgba(0,0,0,.08); }
  .sitem button { border: 0; border-radius: 12px; padding: 8px; font-weight: 800; background: #fff; color: var(--brown); box-shadow: 0 3px 0 #d7c3a0; }
  .sitem button.buy { background: linear-gradient(#ffd54f, #ffa000); color: #4e342e; box-shadow: 0 3px 0 #c67c00; }

  /* wyniki */
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0; }
  .tabs button { border: 0; border-radius: 14px; padding: 7px 11px; font-weight: 700; background: rgba(255,255,255,.75); color: var(--brown); }
  .tabs button.on { background: linear-gradient(#9ccc65, var(--green2)); color: #fff; }
  .board { list-style: none; padding: 0; margin: 0; background: var(--cream); border-radius: 16px; overflow: hidden; }
  .board li { display: grid; grid-template-columns: 1fr auto; padding: 10px 14px; border-bottom: 1px solid #eadcc0; color: var(--brown); }
  .board li small { grid-column: 1 / 3; opacity: .55; font-size: 11px; }
  .board li.empty { display: block; text-align: center; opacity: .7; }

  /* powiadomienia */

  .sown { background: linear-gradient(#a5d65a, #62a72d); color: #fff; box-shadow: 0 3px 0 #33691e; }
  .sused { background: #f1f8e9; color: #558b2f; box-shadow: inset 0 0 0 2px #c5e1a5; }
