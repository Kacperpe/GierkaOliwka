<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Gierka Oliwka</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000;
    touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent; font-family: system-ui, sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #over { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(0,0,0,.55); }
  #over .card { background: #fff8e7; border-radius: 22px; padding: 26px 30px; text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,.4); border: 4px solid #8bc34a; min-width: 230px; }
  #over h1 { margin: 0 0 10px; color: #e65100; font-size: 28px; }
  #over p { margin: 6px 0; font-size: 18px; color: #4e342e; }
  #over button { margin-top: 16px; font-size: 20px; font-weight: 700; color: #fff; border: 0;
    background: linear-gradient(#9ccc65, #558b2f); padding: 12px 28px; border-radius: 14px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="over"><div class="card">
  <h1>Koniec gry!</h1>
  <p>Wynik: <b id="ovScore">0</b></p>
  <p>Rekord: <b id="ovBest">0</b></p>
  <button id="again">Zagraj jeszcze raz</button>
</div></div>
<script src="game.js"></script>
</body>
</html>
